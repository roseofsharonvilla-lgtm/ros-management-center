<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROS Management Center</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c9a54a'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' font-weight='700' text-anchor='middle' fill='%231e5631'%3ER%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1e5631; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #1e5631; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #fff; background: linear-gradient(160deg, #2a6b3f, #123d22); transition: opacity .4s; z-index: 2; }
  #loader.hide { opacity: 0; pointer-events: none; }
  .badge { width: 64px; height: 64px; border-radius: 14px; background: #c9a54a; color: #1e5631; display: flex; align-items: center; justify-content: center; font: 700 34px Georgia, serif; }
  .spin { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.25); border-top-color: #c9a54a; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #fallback { display: none; text-align: center; max-width: 320px; padding: 0 16px; }
  #fallback a { display: inline-block; margin-top: 10px; padding: 12px 22px; background: #c9a54a; color: #1e5631; border-radius: 10px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div id="loader">
  <div class="badge">R</div>
  <div style="font-weight:700;font-size:20px">Rose of Sharon</div>
  <div style="opacity:.8;margin-top:-10px">Management Center</div>
  <div class="spin" id="spin"></div>
  <div id="fallback">
    <div>Taking longer than usual to load.</div>
    <a id="direct" href="#" target="_top">Open Management Center</a>
  </div>
</div>
<iframe id="app" title="ROS Management Center" allow="clipboard-write"></iframe>
<script>
  var APP_URL = "https://script.google.com/macros/s/AKfycbxYfPhYBs3Y2Vyz8fEfr3vRkn4yQccI1YZoKeVLl-o6SMp6P1FcZJ--Xz-gtswdhKE/exec";
  var frame = document.getElementById("app");
  var loader = document.getElementById("loader");
  document.getElementById("direct").href = APP_URL;
  frame.addEventListener("load", function () { loader.classList.add("hide"); });
  frame.src = APP_URL;
  setTimeout(function () {
    if (!loader.classList.contains("hide")) {
      document.getElementById("spin").style.display = "none";
      document.getElementById("fallback").style.display = "block";
    }
  }, 12000);
</script>
</body>
</html>
